<main class="add-user-page">

  <!-- HEADER -->
  <header class="page-header">

    <div>
      <a
        routerLink="/users"
        class="back-link"
      >
        ← Back to Users
      </a>

      <h1>Add New User</h1>

      <p>
        Create an account for a member of the school.
      </p>
    </div>

  </header>


  <!-- FORM CARD -->
  <section class="form-card">

    <form
      #userForm="ngForm"
      (ngSubmit)="createUser()"
    >

      <!-- PERSONAL INFORMATION -->
      <div class="form-section">

        <div class="section-heading">
          <h2>Personal Information</h2>
          <p>Enter the user's basic information.</p>
        </div>

        <div class="form-grid">

          <div class="form-group">

            <label for="firstName">
              First Name
            </label>

            <input
              id="firstName"
              type="text"
              name="firstName"
              [(ngModel)]="newUser.firstName"
              placeholder="Enter first name"
              required
            >

          </div>


          <div class="form-group">

            <label for="lastName">
              Last Name
            </label>

            <input
              id="lastName"
              type="text"
              name="lastName"
              [(ngModel)]="newUser.lastName"
              placeholder="Enter last name"
              required
            >

          </div>

        </div>


        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="newUser.email"
            placeholder="user@school.com"
            required
          >

        </div>

      </div>


      <!-- ACCOUNT INFORMATION -->
      <div class="form-section">

        <div class="section-heading">
          <h2>Account Information</h2>
          <p>Configure the user's school account.</p>
        </div>


        <div class="form-group">

          <label for="role">
            Role
          </label>

          <select
            id="role"
            name="role"
            [(ngModel)]="newUser.role"
            required
          >

            <option value="STUDENT">
              Student
            </option>

            <option value="TEACHER">
              Teacher
            </option>

            <option value="PARENT">
              Parent
            </option>

            <option value="ADMIN">
              Administrator
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="password">
            Temporary Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="newUser.password"
            placeholder="Enter temporary password"
            required
          >

          <small>
            The user can change this password after signing in.
          </small>

        </div>

      </div>


      <!-- ACTIONS -->
      <div class="form-actions">

        <a
          routerLink="/users"
          class="cancel-btn"
        >
          Cancel
        </a>

        <button
          type="submit"
          class="create-btn"
          [disabled]="userForm.invalid"
        >
          Create User
        </button>

      </div>

    </form>

  </section>

</main>
